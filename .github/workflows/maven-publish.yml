name: Java CI with Maven and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # 当推送以 v 开头的标签（如 v1.0.0）时触发发布
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11 # 适配 pom.xml 中的 source/target
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: 1. 代码规范检查与测试
        # 如果配置了 checkstyle 插件，verify 会自动运行规范检查和单元测试
        run: mvn clean verify

      - name: 2. 构建可执行 JAR
        run: mvn package -DskipTests # 之前已运行过测试，此处跳过

      - name: 3. 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: zuul-game-jar
          path: target/zuul-*.jar

      - name: 4. 自动发布 Release (仅当推送 Tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: target/zuul-*.jar
          body: "自动生成的游戏安装包。运行方法：java -jar <filename>.jar"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}